# Free Supabase projects pause after 7 days without traffic.
# This pings the database every 3 days so the site stays available.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 1 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query app_config
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://necgwxvkjfjepqymzohq.supabase.co/rest/v1/app_config?select=key&limit=1" \
            -H "apikey: sb_publishable_roU0G1STW-r2NROYks_e1A_STAo4IUP")
          echo "HTTP $code"
          test "$code" = "200"
